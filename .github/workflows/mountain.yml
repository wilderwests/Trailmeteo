name: Actualizar boletines de montaña y tráfico DGT
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/mountain.yml', '*.js', '*.css', '*.html', 'img/**', 'tests/**', 'data/webcams.json', 'package.json']
permissions:
  contents: read
  pages: write
  id-token: write
  models: read
concurrency:
  group: mountain-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar aplicación
        timeout-minutes: 6
        run: |
          npm install --ignore-scripts
          npm test
          node scripts/build-public.mjs public --test
          python3 tests/alerts.test.py
          python3 tests/dgt.test.py
          python3 tests/ai.test.py
          python3 tests/aludes.test.py
          python3 tests/v17.test.py
          python3 tests/foros.test.py
          pip install -q --break-system-packages rasterio pillow numpy || pip install -q rasterio pillow numpy
          python3 tests/snowmap.test.py
      - name: Fecha para cachés diarias
        id: day
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "hour=$(date -u +%Y-%m-%d-%H)" >> "$GITHUB_OUTPUT"
      - name: Nieve observada Sentinel-2 y validación (caché diaria)
        id: snowmap
        uses: actions/cache@v4
        with:
          path: |
            data/snow-s2.png
            data/snow-s2-data.png
            data/snow-s2.json
            data/validation.json
          key: snowmap-${{ steps.day.outputs.day }}
          restore-keys: snowmap-
      - name: Catálogo de canales (OpenStreetMap, una vez al día)
        id: canales
        uses: actions/cache@v4
        with:
          path: data/canales.json
          key: canales-${{ steps.day.outputs.day }}
          restore-keys: canales-
      - name: Nomenclátor y esquí de montaña (caché diaria)
        id: lugares
        uses: actions/cache@v4
        with:
          path: |
            data/lugares.json
          key: lugares2-${{ steps.day.outputs.day }}
          restore-keys: lugares2-
      - name: Esquí de montaña (caché diaria)
        id: skitour
        uses: actions/cache@v4
        with:
          path: data/skitour.json
          key: skitour-${{ steps.day.outputs.day }}
          restore-keys: skitour-
      - name: Foros y noticias (caché de una hora)
        id: foros
        uses: actions/cache@v4
        with:
          path: data/foros.json
          key: foros-${{ steps.day.outputs.hour }}
          restore-keys: foros-
      - name: Precios y plazas de refugios (caché diaria)
        id: refugios
        uses: actions/cache@v4
        with:
          path: data/refugios-live.json
          key: refugios-${{ steps.day.outputs.day }}
          restore-keys: refugios-
      - name: Refugios libres y su estado (caché diaria)
        id: libres
        uses: actions/cache@v4
        with:
          path: data/refugios-libres.json
          key: libres-${{ steps.day.outputs.day }}
          restore-keys: libres-
      - name: Estado anterior de las webcams
        uses: actions/cache@v4
        with:
          path: data/webcams-live.json
          key: webcams-${{ github.run_id }}
          restore-keys: webcams-
      - name: Obtener boletines oficiales
        timeout-minutes: 5
        run: |
          python3 scripts/update-mountain.py
          python3 scripts/update-alerts.py
          python3 scripts/update-dgt.py || true
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) || true
          timeout 120 python3 scripts/update-aludes.py || true
      - name: Actualizar canales si la copia no es de hoy
        if: steps.canales.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: timeout 200 python3 scripts/update-canales.py || true
      - name: Nomenclátor de montaña y esquí de montaña si la copia no es de hoy
        if: steps.lugares.outputs.cache-hit != 'true' || hashFiles('data/lugares.json') == ''
        timeout-minutes: 12
        run: |
          timeout 400 node scripts/update-lugares.mjs || true
          timeout 300 python3 scripts/update-lugares.py || true
      - name: Esquí de montaña si la copia no es de hoy
        if: steps.skitour.outputs.cache-hit != 'true' || hashFiles('data/skitour.json') == ''
        timeout-minutes: 4
        run: timeout 200 python3 scripts/update-skitour.py || true
      - name: Foros y noticias si la copia no es de esta hora
        if: steps.foros.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: timeout 150 python3 scripts/update-foros.py || true
      - name: Refugios si la copia no es de hoy
        if: steps.refugios.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: timeout 150 python3 scripts/update-refugios.py || true
      - name: Refugios libres (OpenStreetMap y noticias) si la copia no es de hoy
        if: steps.libres.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: timeout 330 python3 scripts/update-refugios-libres.py || true
      - name: Webcams activas
        timeout-minutes: 3
        run: timeout 150 python3 scripts/update-webcams.py || true
      - name: Nieve observada Sentinel-2 si la copia no es de hoy
        if: steps.snowmap.outputs.cache-hit != 'true'
        timeout-minutes: 9
        run: timeout 480 python3 scripts/update-snowmap.py || true
      - name: Parte de montaña con IA (GitHub Models)
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-ai.py || true
      - name: Preparar web (JS/CSS minificado, con aviso de copyright)
        run: node scripts/build-public.mjs public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
